name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: End-to-end pipeline
        run: |
          python -m src.datagen --seed 42
          python -m src.reconciliation
          python -m src.warehouse
          python -m src.forecasting --no-prophet --no-mlflow
          python -m src.variance
          python -m src.monitoring
          python -m powerbi.build_dashboard
          python -m powerbi.export_model
          python -m src.agent.evaluate --stub
          # No channels configured in CI, so this exercises rules + digest +
          # the file channel only — which is exactly the path that must never
          # break, since it is the one alerts fall back to.
          python -m src.alerting --dry-run
